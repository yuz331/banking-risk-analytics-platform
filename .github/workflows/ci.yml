name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dashboard dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run complete test suite without skips
        run: |
          python - <<'PY'
          import os
          import unittest
          from pathlib import Path

          suite = unittest.defaultTestLoader.discover("tests")
          if suite.countTestCases() == 0:
              raise SystemExit("No tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.wasSuccessful() and not result.skipped
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with Path(summary).open("a", encoding="utf-8") as handle:
                  handle.write("## Automated tests\n\n")
                  handle.write(f"Tests run: {result.testsRun}\n\n")
                  handle.write(f"Failures: {len(result.failures)}; errors: {len(result.errors)}; skipped: {len(result.skipped)}\n\n")
                  handle.write(f"Result: {'passed' if passed else 'failed'}\n")
          if result.skipped:
              print("CI requires every test, including Streamlit UI tests; skipped tests fail this job.")
          raise SystemExit(0 if passed else 1)
          PY

      - name: Prepare a fresh 50,000-transaction demo
        run: python run_demo.py --prepare-only --demo-dir data/ci_demo

      - name: Reuse the prepared demo
        run: python run_demo.py --prepare-only --demo-dir data/ci_demo

      - name: Confirm generated data stays untracked
        run: |
          python - <<'PY'
          import subprocess

          changes = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"], text=True
          ).strip()
          if changes:
              raise SystemExit("Tests or demo preparation left repository changes:\n" + changes)
          print("Generated test snapshots remain ignored; the checkout is unchanged.")
          PY
